# Render blueprint for NutriGen.ai
#
# Deploy with: Render dashboard -> New -> Blueprint -> point at this repo.
# Secrets are NOT stored here on purpose. After the first deploy, set these in
# the dashboard under each service's Environment tab:
#   DATABASE_URL   mysql+aiomysql://user:pass@host:port/database
#   GEMINI_API_KEY_1 / GEMINI_API_KEY_2
#
# The frontend service needs VITE_API_BASE set to the backend's public URL plus
# /api, e.g. https://nutrigen-backend.onrender.com/api. Vite inlines env vars at
# build time, so adding it later means triggering a redeploy.

services:
  - type: web
    name: nutrigen-backend
    runtime: python
    plan: free
    # rootDir intentionally omitted (the spec defaults to the repo root). The
    # start command imports `backend.app.main`, which only resolves when the
    # working directory is the repo root, not backend/.
    buildCommand: pip install -r backend/requirements.txt
    # --host 0.0.0.0 is required; without it Render cannot reach the service.
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    # /docs is switched off in production (it lists every endpoint), so the
    # health check uses /health, which answers without touching the database.
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      # HMAC key for session tokens. Set this in the dashboard; without it the
      # built-in fallback is used and anyone could forge a valid token.
      - key: AUTH_TOKEN_SECRET
        sync: false
      # The website(s) allowed to call this API, e.g.
      # https://nutrigen-frontend.onrender.com (no trailing slash, comma
      # separated for several). Without it the browser blocks the frontend.
      - key: FRONTEND_ORIGINS
        sync: false

  - type: web
    name: nutrigen-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # The app uses BrowserRouter with real paths (/signin, /app/chat). A static
    # host serves files literally, so requesting those paths directly returned
    # 404 "Not Found" and a page refresh on any in-app route showed a blank
    # screen. Rewriting every path to the SPA shell lets React Router handle
    # routing on the client.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false
